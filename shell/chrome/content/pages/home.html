<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Home</title>
  <link rel="stylesheet" href="chrome://seijaku/content/pages/pages.css" />
  <link rel="stylesheet" href="chrome://seijaku/content/pages/home.css" />
  <script src="chrome://seijaku/content/pages/theme.js"></script>
  <script src="chrome://seijaku/content/pages/home.js"></script>
</head>
<body>
  <!-- Ryoku language, drawn, not shaded: a faint dot field over the
       whole page, and on the right a dot-art red moon over abstract
       horizon lines, inside a thin abstract circle. No gradients
       anywhere, and no image asset: the art is drawn here, in SVG. -->
  <svg id="field" aria-hidden="true">
    <defs>
      <pattern id="field-dots" width="26" height="26" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" style="fill: var(--fg)" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#field-dots)" />
  </svg>
  <svg id="art" aria-hidden="true" viewBox="0 0 600 600">
    <defs>
      <pattern id="moon-dots" width="13" height="13" patternUnits="userSpaceOnUse">
        <circle cx="2.5" cy="2.5" r="1.8" style="fill: var(--accent)" />
      </pattern>
    </defs>
    <circle cx="300" cy="300" r="285" fill="none" style="stroke: var(--line)" stroke-width="1" />
    <circle cx="300" cy="270" r="130" fill="url(#moon-dots)" opacity="0.6" />
    <path d="M 60 430 Q 300 400 540 430" fill="none" style="stroke: var(--line)" stroke-width="1" />
    <path d="M 90 470 Q 300 445 510 470" fill="none" style="stroke: var(--line)" stroke-width="1" />
    <path d="M 130 510 Q 300 490 470 510" fill="none" style="stroke: var(--line)" stroke-width="1" />
    <text x="560" y="40" style="fill: var(--muted)" font-size="28">+</text>
    <text x="30" y="580" style="fill: var(--muted)" font-size="28">+</text>
  </svg>
  <div id="vertical" aria-hidden="true">静寂</div>
  <header id="brand-top">
    <div id="brand-name">seijaku</div>
    <div id="tagline">THE WEB CAN WAIT.</div>
  </header>
  <aside id="weather" hidden="hidden">
    <div id="weather-date"></div>
    <div id="weather-temp"></div>
    <div id="weather-cond"></div>
    <div id="weather-city"></div>
  </aside>
  <nav id="counts" aria-label="Browser counts">
    <div class="count-row"><span>Tabs</span><span id="count-tabs">–</span></div>
    <button class="count-row count-link" id="count-bookmarks-row" type="button"><span>Bookmarks</span><span id="count-bookmarks">–</span></button>
    <button class="count-row count-link" id="count-history-row" type="button"><span>History</span><span id="count-history">–</span></button>
    <button class="count-row count-link" id="count-settings-row" type="button"><span>Settings</span><span>→</span></button>
  </nav>
  <main>
    <p id="greeting-jp"></p>
    <h1 id="greeting"></h1>
    <p id="greeting-sub">The internet will wait.</p>
    <form id="search-form" autocomplete="off">
      <input id="search" type="text" spellcheck="false"
             placeholder="Search the web&#8230;" autofocus="autofocus" />
    </form>
    <div id="frequent">
      <div id="frequent-label">FREQUENT</div>
      <div id="frequent-list"></div>
    </div>
    <p id="sleeping" class="muted" hidden="hidden"></p>
  </main>
</body>
</html>
