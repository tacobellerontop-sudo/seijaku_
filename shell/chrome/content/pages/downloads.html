<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Downloads</title>
  <link rel="stylesheet" href="chrome://seijaku/content/pages/pages.css" />
  <link rel="stylesheet" href="chrome://seijaku/content/pages/lists.css" />
  <script src="chrome://seijaku/content/pages/theme.js"></script>
  <script src="chrome://seijaku/content/pages/downloads.js"></script>
</head>
<body>
  <main>
    <h1>downloads</h1>
    <p class="muted">Files the browser downloaded. They land in the folder
    chosen in Settings (or the system Downloads folder); changing it
    affects new downloads only.</p>
    <p>
      <input id="search" type="text" spellcheck="false" autocomplete="off" placeholder="Search downloads…" />
    </p>
    <p>
      <button id="clear-finished" type="button">Clear finished</button>
      <button id="clear-all" type="button">Clear all</button>
    </p>
    <p id="unavailable" class="muted" hidden="hidden">Downloads aren't listed in this build — files still land in your Downloads folder.</p>
    <div id="list"></div>
    <p id="empty" class="muted" hidden="hidden">No downloads yet.</p>
  </main>
</body>
</html>
