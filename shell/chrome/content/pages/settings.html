<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Settings</title>
  <link rel="stylesheet" href="chrome://seijaku/content/pages/pages.css" />
  <link rel="stylesheet" href="chrome://seijaku/content/pages/settings.css" />
  <script src="chrome://seijaku/content/pages/theme.js"></script>
  <script src="chrome://seijaku/content/pages/settings.js"></script>
</head>
<body>
  <main>
    <h1>settings</h1>
    <p class="muted">A few settings. Everything else is already decided: quiet, light, and out of the way.</p>
    <label>
      Theme
      <select id="setting-theme">
        <option value="ink">Ink (dark)</option>
        <option value="paper">Paper (light)</option>
      </select>
    </label>
    <label>
      Put idle tabs to sleep after (minutes, 0 turns it off)
      <input id="setting-sleep" type="number" min="0" max="240" />
    </label>
    <label>
      Search engine (use %s for the search)
      <input id="setting-search" type="text" spellcheck="false" />
    </label>
    <label>
      Home page
      <input id="setting-homepage" type="text" spellcheck="false" />
    </label>
    <label>
      <input id="setting-update" type="checkbox" />
      Check for updates on startup (at most once a day; a newer version downloads in the background and installs when you quit)
    </label>
    <label>
      Updates
      <button id="setting-update-now" type="button">Update Seijaku now</button>
      <span class="muted">Checks GitHub, downloads the installer, and restarts Seijaku on the new version.</span>
    </label>
    <p id="saved" class="muted" hidden="hidden">Saved.</p>
  </main>
</body>
</html>
