<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PDF viewer</title>
  <link rel="stylesheet" href="chrome://seijaku/content/pages/pages.css" />
  <link rel="stylesheet" href="chrome://seijaku/content/pages/pdf.css" />
  <script src="chrome://seijaku/content/vendor/pdf-lib/pdf-lib.min.js"></script>
  <script type="module" src="chrome://seijaku/content/pages/pdf.js"></script>
</head>
<body>
  <header id="topbar">
    <span id="filename" class="quiet" title="Original file">Loading…</span>
    <span class="spacer"></span>
    <button id="prev" type="button" title="Previous page">Prev</button>
    <span id="indicator" class="muted">Page — of —</span>
    <button id="next" type="button" title="Next page">Next</button>
    <span class="sep"></span>
    <button id="zoom-out" type="button" title="Zoom out">−</button>
    <span id="zoom-label" class="muted">Fit width</span>
    <button id="zoom-in" type="button" title="Zoom in">+</button>
    <button id="zoom-fit" type="button" title="Fit page width">Fit width</button>
  </header>
  <div id="toolbar" role="toolbar" aria-label="Annotation tools">
    <span class="tool-label quiet">annotate</span>
    <button id="tool-ink" type="button" class="tool active" title="Freehand ink">Ink</button>
    <button id="tool-note" type="button" class="tool" title="Add a text note where you click">Note</button>
    <button id="tool-eraser" type="button" class="tool" title="Removes the last stroke, or the last note if the page has no strokes, on the current page">Eraser — last stroke/note</button>
    <span class="sep"></span>
    <span class="tool-label quiet">colour</span>
    <span id="colors" role="radiogroup" aria-label="Ink colour">
      <button type="button" class="swatch active" data-color="#d8442a" style="background:#d8442a" title="Vermilion" aria-label="Vermilion"></button>
      <button type="button" class="swatch" data-color="#d9a441" style="background:#d9a441" title="Ochre" aria-label="Ochre"></button>
      <button type="button" class="swatch" data-color="#6a9a5b" style="background:#6a9a5b" title="Moss" aria-label="Moss"></button>
      <button type="button" class="swatch" data-color="#5b8ab5" style="background:#5b8ab5" title="Indigo" aria-label="Indigo"></button>
      <button type="button" class="swatch" data-color="#ece4d3" style="background:#ece4d3" title="Bone" aria-label="Bone"></button>
    </span>
    <span class="sep"></span>
    <label class="tool-label quiet" for="width">width</label>
    <select id="width">
      <option value="1.5">Thin</option>
      <option value="3" selected="selected">Medium</option>
      <option value="5">Thick</option>
    </select>
    <span class="spacer"></span>
    <button id="save" type="button" title="Save a copy with annotations into Downloads">Save annotated copy</button>
  </div>
  <p id="status" class="muted" role="status">Loading PDF…</p>
  <p id="error" class="error" role="alert" hidden="hidden"></p>
  <main id="pages" hidden="hidden"></main>
</body>
</html>
