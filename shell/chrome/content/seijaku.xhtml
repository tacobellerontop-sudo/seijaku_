<?xml version="1.0"?>
<!-- Seijaku: the whole window. One tab strip, one page, and floating
     panels (the URL bar, the permission prompt, extension popups)
     that appear over the page only when asked. There is no persistent
     address bar: Ctrl+T / Ctrl+L summon the floating bar. Tabs and
     pages are added by seijaku.js. -->
<!DOCTYPE html>
<html id="seijaku-window"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      windowtype="seijaku:main"
      icon="chrome://seijaku/content/icons/default/seijaku-window.ico"
      customtitlebar="true"
      width="1280" height="800"
      persist="screenX screenY width height sizemode">
<head>
  <meta charset="utf-8" />
  <title>Seijaku</title>
  <link rel="stylesheet" href="chrome://global/skin/global.css" />
  <link rel="stylesheet" href="chrome://seijaku/content/seijaku.css" />
  <script src="chrome://global/content/customElements.js"></script>
  <script src="chrome://seijaku/content/seijaku.js"></script>
</head>
<body>
  <!-- The whole chrome row: seal, nav, tabs, actions, drag space,
       window buttons. Its edge (top/left/right/bottom) is set by
       seijaku.tabs.position; the CSS lays it out per edge. -->
  <div id="strip">
    <span id="seal" title="Seijaku">&#x7c21;</span>
    <span id="nav-buttons">
      <button id="nav-back" class="nav-button" title="Back (Alt+Left)" tabindex="-1" disabled="disabled"></button>
      <button id="nav-forward" class="nav-button" title="Forward (Alt+Right)" tabindex="-1" disabled="disabled"></button>
      <button id="nav-reload" class="nav-button" title="Reload (Ctrl+R)" tabindex="-1"></button>
      <button id="nav-home" class="nav-button" title="Home (Alt+Home)" tabindex="-1"></button>
    </span>
    <div id="tabbar" role="tablist"></div>
    <span id="strip-actions">
      <button id="tab-new" class="nav-button" title="New tab (Ctrl+T)" tabindex="-1"></button>
      <button id="tab-undo" class="nav-button" title="Reopen closed tab (Ctrl+Shift+T)" tabindex="-1" disabled="disabled"></button>
      <button id="bookmark-star" class="nav-button" title="Bookmark this page (Ctrl+D)" tabindex="-1"></button>
      <button id="reader-button" class="nav-button" title="Reader view" tabindex="-1"></button>
      <button id="bookmarks-button" class="nav-button" title="Bookmarks (Ctrl+Shift+B)" tabindex="-1"></button>
      <button id="history-button" class="nav-button" title="History (Ctrl+H)" tabindex="-1"></button>
      <button id="downloads-button" class="nav-button" title="Downloads (Ctrl+J)" tabindex="-1"></button>
      <!-- Connection security (this strip button), kept apart from
           the permission lock: this is whether the connection is
           trustworthy, that is what the site may use. -->
      <button id="sec-lock" class="nav-button" title="Connection security" tabindex="-1" hidden="hidden"></button>
      <span id="ext-buttons"></span>
      <button id="perm-lock" class="nav-button" title="Site permissions for this site" tabindex="-1" hidden="hidden"></button>
      <button id="strip-menu" class="nav-button" title="Settings (Ctrl+,)" tabindex="-1"></button>
    </span>
    <span id="strip-drag"></span>
    <span id="private-badge" hidden="hidden">Private</span>
    <div id="titlebar-buttons">
      <button id="titlebar-min" class="titlebar-button" title="Minimize" tabindex="-1"></button>
      <button id="titlebar-max" class="titlebar-button" title="Maximize" tabindex="-1"></button>
      <button id="titlebar-restore" class="titlebar-button" title="Restore" tabindex="-1"></button>
      <button id="titlebar-close" class="titlebar-button" title="Close" tabindex="-1"></button>
    </div>
  </div>
  <div id="main">
    <div id="content"></div>
    <div id="bottom">
      <div id="message" hidden="hidden"></div>
      <div id="findbar" hidden="hidden">
        <input id="find-input" type="text" spellcheck="false" autocomplete="off"
               placeholder="Find in page — Enter for next, Shift+Enter for previous, Esc to close" />
      </div>
    </div>
  </div>
  <!-- The auto-hide reveal strip: a hit-testable edge area OUTSIDE
       the hidden chrome, so hovering the placement edge always
       reveals the strip. See the auto-hide section in seijaku.css. -->
  <div id="edge-strip"></div>
  <xul:popupset id="mainPopupSet">
    <!-- The right-click menu for pages, tabs and the strip: one popup,
         filled by seijaku.js each time it opens. -->
    <xul:menupopup id="seijaku-menu" />
    <!-- The short note when a page goes full screen (a video): how to
         leave. It never takes focus, so Esc still reaches the page. -->
    <xul:panel id="fullscreen-note" noautofocus="true" noautohide="true" consumeoutsideclicks="false">
      <div id="fullscreen-note-text"></div>
    </xul:panel>
    <!-- The floating URL bar: a XUL panel, so it renders above page
         content (a plain div did not reliably do that). -->
    <xul:panel id="urlbar-panel">
      <div id="urlbar-inner">
        <div id="urlbar-row">
          <input id="urlbar-input" type="text" spellcheck="false" autocomplete="off"
                 placeholder="Search or type an address" />
          <button id="urlbar-copy" class="urlbar-tool" title="Copy this page's address" tabindex="-1">Copy</button>
          <button id="urlbar-reader" class="urlbar-tool" title="Reader view" tabindex="-1">Reader</button>
        </div>
        <div id="urlbar-suggest" hidden="hidden"></div>
      </div>
    </xul:panel>
    <!-- The permission prompt, anchored at the top centre of the
         window (where the floating bar appears) when a site asks. -->
    <xul:panel id="perm-panel">
      <div id="perm-inner">
        <div id="perm-prompt">
          <div id="perm-text"></div>
          <label id="perm-remember-row"><input id="perm-remember" type="checkbox" /> Remember this decision</label>
          <div id="perm-buttons">
            <button id="perm-allow" type="button">Allow</button>
            <button id="perm-block" type="button">Block</button>
          </div>
        </div>
        <div id="perm-manage" hidden="hidden">
          <div id="perm-manage-title"></div>
          <div id="perm-manage-list"></div>
          <button id="perm-manage-close" type="button">Done</button>
        </div>
      </div>
    </xul:panel>
    <!-- Extension popups render here, anchored to their strip
         button. The <browser> inside is made when a popup opens and
         removed when it closes (see ext/ext-browserAction.js). -->
    <xul:panel id="ext-popup-panel"></xul:panel>
    <!-- Extension installs: what an extension will be able to do,
         asked before it is added (see showExtensionPrompt). -->
    <xul:panel id="ext-prompt-panel" noautohide="true">
      <div id="ext-prompt-inner">
        <div id="ext-prompt-head">
          <img id="ext-prompt-icon" alt="" hidden="hidden" />
          <div id="ext-prompt-title"></div>
        </div>
        <div id="ext-prompt-intro"></div>
        <ul id="ext-prompt-list"></ul>
        <div id="ext-prompt-buttons">
          <button id="ext-prompt-cancel" type="button">Cancel</button>
          <button id="ext-prompt-accept" type="button">Add</button>
        </div>
      </div>
    </xul:panel>
    <!-- Site information, opened from the security lock: host,
         connection state, this site's permission decisions, and a
         way to Settings. A XUL panel, so it renders above content. -->
    <xul:panel id="site-panel">
      <div id="site-inner">
        <div id="site-host"></div>
        <div id="site-state"></div>
        <div id="site-perms"></div>
        <div id="site-buttons">
          <button id="site-settings" type="button">Settings</button>
          <button id="site-close" type="button">Done</button>
        </div>
      </div>
    </xul:panel>
    <!-- The command palette (Ctrl+K): a searchable action list, not
         a command bar — no `:` prompt, no `:command` syntax, the
         entries are picked from, not typed into. A XUL panel, so it
         renders above page content like the floating bar. -->
    <xul:panel id="palette-panel">
      <div id="palette-inner">
        <input id="palette-input" type="text" spellcheck="false" autocomplete="off"
               placeholder="Type to search commands, tabs, bookmarks…" />
        <div id="palette-list" hidden="hidden"></div>
      </div>
    </xul:panel>
  </xul:popupset>
</body>
</html>
