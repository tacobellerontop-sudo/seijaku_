name: Screenshots

# Builds Seijaku exactly as the Release workflow does, runs it in a real
# window on Windows, and captures the main screens (tests/screens). The
# PNGs are uploaded as an artifact and committed to the "screenshots"
# branch under the commit's short SHA, so pull requests can show them.
# Nothing is released.

on:
  push:
    branches: ['claude/**']
    paths: ['shell/**', 'tests/screens/**', '.github/workflows/screens.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Larger screen
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1600 -Height 900 -Force

      - name: Download Mozilla's Gecko (Firefox release build)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US" -OutFile "$env:RUNNER_TEMP\firefox-setup.exe"

      - name: Package Seijaku
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build\package.ps1 -Installer "$env:RUNNER_TEMP\firefox-setup.exe" -Out out

      - name: Capture screens
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tests\screens\run.ps1 -App out\seijaku -Out "$env:RUNNER_TEMP\screens"

      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}\screens

      - name: Commit to the screenshots branch
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\screens\*.png")) { throw 'no screenshots were captured' }
          $sha = "${{ github.sha }}".Substring(0, 7)
          $dir = Join-Path $env:RUNNER_TEMP 'shots-branch'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $dir
          Push-Location $dir
          git fetch origin screenshots 2>$null
          if ($LASTEXITCODE -eq 0) { git checkout screenshots } else { git checkout --orphan screenshots; git rm -rf . 2>$null }
          New-Item -ItemType Directory -Force $sha | Out-Null
          Copy-Item "$env:RUNNER_TEMP\screens\*.png" $sha
          git add $sha
          git commit -m "Screenshots for $sha"
          # Runs for other commits may push at the same time.
          for ($i = 0; $i -lt 5; $i++) {
            git push origin screenshots
            if ($LASTEXITCODE -eq 0) { break }
            git pull --rebase origin screenshots
          }
          if ($LASTEXITCODE -ne 0) { throw 'could not push the screenshots' }
          Pop-Location
